# Archivo base: servicios, red y healthchecks. NO define almacenamiento.
# Úsalo siempre junto a una capa de almacenamiento:
#   docker compose -f compose.yml -f compose.ram.yml     --profile postgres up -d --wait
#   docker compose -f compose.yml -f compose.persist.yml --profile postgres up -d --wait
# O más fácil: ./devdb up postgres [--ram|--persist]
#
# Perfiles: postgres, mysql, mongo, redis, qdrant (bases de datos)
#           adminer, mongo-express, redis-commander (paneles web)
#           all (todo)
# Toda la configuración se puede sobrescribir con un archivo .env (ver .env.example).

name: devdb

networks:
  dev-net:
    name: devdb-net
    driver: bridge

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    profiles: [postgres, all]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
      POSTGRES_DB: ${DB_NAME:-devdb}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - dev-net

  mysql:
    image: mysql:${MYSQL_VERSION:-8.0-oracle}
    profiles: [mysql, all]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpass}
      MYSQL_USER: ${DB_USER:-dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpass}
      MYSQL_DATABASE: ${DB_NAME:-devdb}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Usa TCP: durante la inicialización MySQL corre sin red, así que esto solo pasa cuando ya está listo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      - dev-net

  mongo:
    image: mongo:${MONGO_VERSION:-7.0-jammy}
    profiles: [mongo, all]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-devpass}
      MONGO_INITDB_DATABASE: ${DB_NAME:-devdb}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./init/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      - dev-net

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    profiles: [redis, all]
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - dev-net

  # Base de datos vectorial. Trae su propio panel web en /dashboard.
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}
    profiles: [qdrant, all]
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      # La imagen no incluye curl/wget: se consulta /readyz con el /dev/tcp de bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      - dev-net

  # ---------- Paneles web ----------

  adminer:
    image: adminer:${ADMINER_VERSION:-5.4.1}
    profiles: [adminer, all]
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    networks:
      - dev-net

  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_VERSION:-1.0.2}
    profiles: [mongo-express, all]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER:-dev}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD:-devpass}
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - dev-net

  redis-commander:
    image: rediscommander/redis-commander:${REDIS_COMMANDER_VERSION:-latest}
    profiles: [redis-commander, all]
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_COMMANDER_PORT:-8082}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dev-net
